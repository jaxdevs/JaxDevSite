<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JaxDev | Shop</title>
    <meta name="description" content="3D models, scripts, and shaders I've made.">
    <link rel="icon" type="image/png" href="../Assets/JaxIcon.png">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="shop.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to shop</a>
    <header class="site-header">
            <a class="logo" href="../index.html" aria-label="Jax Dev home">JAX<span>DEV</span><i></i></a>
            <nav aria-label="Main navigation">
                <a class="active" href="../index.html">Home</a>
                <a href="Shop/shop.html">Shop</a>
                <a href="../support.html">Support</a>
            </nav>
            <a href="https://discord.gg/5qxVttwgay" class="header-cta"> Join Discord &#8599 </a> 
        </header>

    <main id="main" class="wrap shop-page">
        <div class="page-intro">
            <p class="eyebrow">the shop</p>
            <h1>Things I <em>made</em>, for you to purchase.</h1>
            <p>3D models, scripts, and shaders.</p>
        </div>

        <div class="shop-tools">
            <div class="shop-search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
                <input id="shop-search" type="search" placeholder="Search the shop" aria-label="Search the shop" autocomplete="off">
            </div>
            <div id="chips" class="chips" role="group" aria-label="Filter by category"></div>
            <p id="result-count" class="result-count" aria-live="polite"></p>
        </div>

        <ul id="product-grid" class="product-grid" aria-label="Products"></ul>
    </main>

    <dialog id="product-modal" class="product-modal" aria-labelledby="modal-title">
        <button type="button" class="modal-close" aria-label="Close">X</button>
        <div id="modal-body"></div>
    </dialog>

    <footer class="site-footer wrap">
            <a class="logo" href="index.html">JAX<span>DEV</span><i></i></a>
            <p>Please Do Not Resell Or Reupload My Assets<br>&copy; <span id="year"></span> Jax Dev.</p>
            <div class="powered-by-stripe">
                <img src="../Assets/Stripe/Powered by Stripe - blurple.svg" alt="PoweredByStripeIcon" width="150" height="50">
            </div>
            <div class="socials">
                <a href="https://github.com/jaxdevs">GitHub</a>
                <a href="https://youtube.com/@notjaxdev">YouTube</a>
                <a href="https://discord.gg/5qxVttwgay">Discord</a>
            </div>
        </footer>

    <script src="products.js"></script>
    <script src="shop.js"></script>
    <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
